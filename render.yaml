services:
  - type: web
    name: apostle-joshua-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: apostle_joshua
      - key: CLIENT_URLS
        value: https://apostle-joshua-web.onrender.com
      - key: CLIENT_URL
        value: https://apostle-joshua-web.onrender.com
      - key: ADMIN_NAME
        value: Apostle Joshua
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        value: apostlejoshuaaogiriosa@gmail.com
